name: burhanpedia

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-burhanpedia}
      POSTGRES_USER: ${POSTGRES_USER:-burhanpedia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-burhanpedia_dev}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - burhanpedia_postgres_data:/var/lib/postgresql

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ':9001'
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-burhanpedia_dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-burhanpedia_dev_secret}
    ports:
      - '127.0.0.1:${S3_PORT:-9000}:9000'
      - '127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - burhanpedia_minio_data:/data

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/$${S3_BUCKET} &&
        mc anonymous set download local/$${S3_BUCKET}
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-burhanpedia_dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-burhanpedia_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-burhanpedia-images}

volumes:
  burhanpedia_postgres_data:
  burhanpedia_minio_data:
