name: burhanpedia

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-burhanpedia}
      POSTGRES_USER: ${POSTGRES_USER:-burhanpedia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-burhanpedia_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - burhanpedia_postgres_data:/var/lib/postgresql

volumes:
  burhanpedia_postgres_data:
