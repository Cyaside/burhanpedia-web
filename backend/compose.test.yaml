name: burhanpedia-test

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: burhanpedia_test
      POSTGRES_USER: burhanpedia
      POSTGRES_PASSWORD: burhanpedia_test
    ports:
      - '${POSTGRES_TEST_PORT:-55432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U burhanpedia -d burhanpedia_test']
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
