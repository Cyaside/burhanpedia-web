name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main, overhaul/industry-foundation]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: burhanpedia_test
          POSTGRES_USER: burhanpedia
          POSTGRES_PASSWORD: burhanpedia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U burhanpedia -d burhanpedia_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://burhanpedia:burhanpedia_test@localhost:5432/burhanpedia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run audit:dead-code
      - run: npm run audit:dependencies
      - run: npm test -- --runInBand
      - run: npm run build
