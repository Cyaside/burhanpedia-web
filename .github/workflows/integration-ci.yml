name: Integration CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/integration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: burhanpedia_test
          POSTGRES_USER: burhanpedia
          POSTGRES_PASSWORD: burhanpedia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U burhanpedia -d burhanpedia_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build backend
        working-directory: backend
        run: npm ci && npm run build
      - name: Verify database from migrations
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://burhanpedia:burhanpedia_test@127.0.0.1:5432/burhanpedia_test
        run: npm run test:database
      - name: Test authentication against PostgreSQL
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://burhanpedia:burhanpedia_test@127.0.0.1:5432/burhanpedia_test
          JWT_ACCESS_SECRET: integration-test-secret-with-at-least-32-characters
          FRONTEND_URL: http://localhost:3001
          COOKIE_SECURE: 'false'
        run: npm run test:e2e -- --runInBand
      - name: Verify deterministic demo seed
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://burhanpedia:burhanpedia_test@127.0.0.1:5432/burhanpedia_test
        run: npm run db:seed:demo && npm run db:seed:demo && npm run db:verify:demo
      - name: Install and build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
        run: npm ci && npm run build
